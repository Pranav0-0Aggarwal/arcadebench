map $request_uri $arcadebench_uri {
    ~^(/arcadebench/mcp/)[^/?]*(.*)$ $1<token>$2;
    ~^([^?]*\?(?:.*&)?link=)[^&]*(.*)$ $1<token>$2;
    default $request_uri;
}

log_format arcadebench '$remote_addr - [$time_local] "$request_method $arcadebench_uri $server_protocol" $status $body_bytes_sent $request_time "$http_user_agent"';
